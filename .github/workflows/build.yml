name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 关键：AGP 8.5 禁止同时存在 ANDROID_HOME 和 ANDROID_SDK_ROOT 且值不同
      # ubuntu-latest runner 自带 /usr/local/lib/android/sdk 并 export 了
      # ANDROID_SDK_ROOT，我们必须把它 unset 掉，只保留一个 SDK 路径
      - name: Unset conflicting Android env vars
        run: |
          echo "== before =="
          env | grep -i android || true
          unset ANDROID_SDK_ROOT
          unset ANDROID_HOME
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "== after =="
          env | grep -i android || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK (shared ANDROID_HOME)
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -sL -o cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          # Gradle 8.9 自带的 :sdkmanager 需要 cmdline-tools/latest/ 结构
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "=== SDK tree ==="
          ls "$ANDROID_HOME"

      - name: Verify wrapper (should print Gradle 8.9)
        run: ./gradlew --version

      - name: Build sender APK (A 机)
        run: ./gradlew :sender:assembleDebug --no-daemon --stacktrace

      - name: Build receiver APK (B 机)
        run: ./gradlew :receiver:assembleDebug --no-daemon --stacktrace

      - name: Upload sender APK
        uses: actions/upload-artifact@v4
        with:
          name: sender-debug-apk
          path: sender/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: receiver-debug-apk
          path: receiver/build/outputs/apk/debug/*.apk
          if-no-files-found: error
