name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 关键：用 JOB 级别 env 覆盖 runner 默认的 ANDROID_SDK_ROOT/ANDROID_HOME
# runner 默认自带 /usr/local/lib/android/sdk 并且 export 了两个变量，
# 但我们的新 SDK 装在 $HOME/android-sdk。AGP 8.5 禁止 ANDROID_HOME 和
# ANDROID_SDK_ROOT 同时存在且值不同，所以这里必须用 job-level env 把
# 两者都设成同一个新路径，让 runner 默认值被完全覆盖。
env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  JAVA_HOME: ${{ github.workspace }}/jdk17

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          path: ${{ github.workspace }}/jdk17

      - name: Install Android SDK
        run: |
          set -e
          ls -la "$ANDROID_HOME" || true
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -sL -o cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "=== installed ==="
          ls "$ANDROID_HOME"

      - name: Verify env (ANDROID_HOME == ANDROID_SDK_ROOT)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          [ "$ANDROID_HOME" = "$ANDROID_SDK_ROOT" ] || { echo "❌ mismatch!"; exit 1; }

      - name: Verify wrapper
        run: ./gradlew --version

      - name: Build sender APK (A 机)
        run: ./gradlew :sender:assembleDebug --no-daemon --stacktrace

      - name: Build receiver APK (B 机)
        run: ./gradlew :receiver:assembleDebug --no-daemon --stacktrace

      - name: Upload sender APK
        uses: actions/upload-artifact@v4
        with:
          name: sender-debug-apk
          path: sender/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: receiver-debug-apk
          path: receiver/build/outputs/apk/debug/*.apk
          if-no-files-found: error
