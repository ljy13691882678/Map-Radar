name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 【关键】关掉 setup-java 的 gradle 缓存 + setup-gradle 的 gradle home 缓存。
      # 否则 CI runner 上 ~/.gradle/wrapper/dists/gradle-8.9-bin/... 是旧 run 残留，
      # ./gradlew 会直接捞旧的 8.9 版本（它根本不看我们刚改的 gradle-wrapper.properties），
      # 导致版本目录报错无限循环。关掉缓存让 wrapper 老老实实按 distributionUrl 下载 9.7.1。
      - name: Clean Gradle home (force wrapper re-download)
        run: rm -rf ~/.gradle

      - name: Setup Gradle (wrapper only, no cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: false

      - name: Install Android SDK
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -sL -o cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Verify Gradle 9.7.1 before build
        run: ./gradlew --version 2>&1 | head -15

      - name: Build sender APK (A 机)
        run: ./gradlew :sender:assembleDebug --no-daemon --stacktrace

      - name: Build receiver APK (B 机)
        run: ./gradlew :receiver:assembleDebug --no-daemon --stacktrace

      - name: Upload sender APK
        uses: actions/upload-artifact@v4
        with:
          name: sender-debug-apk
          path: sender/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: receiver-debug-apk
          path: receiver/build/outputs/apk/debug/*.apk
          if-no-files-found: error
