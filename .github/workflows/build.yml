name: Build All (Android + Desktop)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# ---- 环境变量 ----
# ANDROID_HOME / ANDROID_SDK_ROOT 必须相同（AGP 8.5 禁止两个不一致值）
# JAVA_HOME 用 ${{ github.workspace }}/jdk17，setup-java@v4 支持 path 参数
env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  JAVA_HOME: ${{ github.workspace }}/jdk17

jobs:
  # ==========================================================
  #  Job 1 — Android APK（sender + receiver 两个 app）
  # ==========================================================
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          path: ${{ github.workspace }}/jdk17

      - name: Install Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -sL -o cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify wrapper
        run: ./gradlew --version

      - name: Build sender APK (A 机)
        run: ./gradlew :sender:assembleDebug --no-daemon --stacktrace

      - name: Build receiver APK (B 机)
        run: ./gradlew :receiver:assembleDebug --no-daemon --stacktrace

      - name: Upload sender APK
        uses: actions/upload-artifact@v4
        with:
          name: sender-debug-apk
          path: sender/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: receiver-debug-apk
          path: receiver/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ==========================================================
  #  Job 2 — Desktop fat-jar（Windows/macOS/Linux 通用）
  #  只需要 JDK 17，不需要 Android SDK
  # ==========================================================
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          path: ${{ github.workspace }}/jdk17

      - name: Verify wrapper
        run: ./gradlew --version

      - name: Build desktop fat-jar
        run: |
          ./gradlew :desktop:fatJar --no-daemon --stacktrace
          echo "=== produced ==="
          ls -la desktop/build/libs/

      - name: Upload desktop fat-jar
        uses: actions/upload-artifact@v4
        with:
          name: desktop-receiver-fatjar
          path: desktop/build/libs/*.jar
          if-no-files-found: error
