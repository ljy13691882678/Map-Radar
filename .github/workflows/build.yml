name: Build All (Android APKs + Windows EXE)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# ---- Android 端 env：覆盖 runner 默认的 ANDROID_SDK_ROOT ----
# AGP 8.5 禁止 ANDROID_HOME 和 ANDROID_SDK_ROOT 同时存在且值不同
env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  JAVA_HOME: ${{ github.workspace }}/jdk17

jobs:
  # ==========================================================
  #  Job 1 — Android APK（sender + receiver 两个 app）
  # ==========================================================
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          path: ${{ github.workspace }}/jdk17

      - name: Install Android SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -sL -o cmdline.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify wrapper
        run: ./gradlew --version

      - name: Build sender APK (A 机)
        run: ./gradlew :sender:assembleDebug --no-daemon --stacktrace

      - name: Build receiver APK (B 机)
        run: ./gradlew :receiver:assembleDebug --no-daemon --stacktrace

      - name: Upload sender APK
        uses: actions/upload-artifact@v4
        with:
          name: sender-debug-apk
          path: sender/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: receiver-debug-apk
          path: receiver/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ==========================================================
  #  Job 2 — Windows EXE / MSI（Compose Desktop 原生打包）
  #  必须在 windows-latest runner 上跑 —— WiX v3 已预装在镜像里
  # ==========================================================
  desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify wrapper
        run: ./gradlew --version
        shell: pwsh

      - name: Build Windows installer (EXE + MSI)
        # packageDistributionForCurrentOS —— Compose Desktop plugin 自动生成的任务
        # 会产出 nativeDistributions 里 targetFormats(TargetFormat.Msi, TargetFormat.Exe) 指定的所有格式
        run: |
          ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon --stacktrace
          echo "=== dist output ==="
          ls -Recurse desktop\build\dist 2>$null | Select-Object FullName
        shell: pwsh

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-installer
          path: desktop/build/dist/*.exe
          if-no-files-found: error

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-installer
          path: desktop/build/dist/*.msi
          if-no-files-found: error

      # 额外：跨平台 fat-jar（有需要的用户可以直接 java -jar）
      - name: Build fat-jar (cross-platform fallback)
        run: ./gradlew :desktop:fatJar --no-daemon --stacktrace
        shell: pwsh

      - name: Upload fat-jar
        uses: actions/upload-artifact@v4
        with:
          name: desktop-fat-jar
          path: desktop/build/libs/*.jar
          if-no-files-found: error
